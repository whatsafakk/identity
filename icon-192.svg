<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="42" fill="#f7f4ee"/>
  <!-- Denim pattern inside lens -->
  <clipPath id="lens-clip-192">
    <circle cx="82" cy="82" r="52"/>
  </clipPath>
  <!-- Denim base -->
  <circle cx="82" cy="82" r="52" fill="#4a6fa5"/>
  <!-- Denim diagonal lines (warp) -->
  <g clip-path="url(#lens-clip-192)" stroke="#5a82bc" stroke-width="4" opacity="0.7">
    <line x1="20" y1="30" x2="80" y2="134"/>
    <line x1="34" y1="30" x2="94" y2="134"/>
    <line x1="48" y1="30" x2="108" y2="134"/>
    <line x1="62" y1="30" x2="122" y2="134"/>
    <line x1="76" y1="30" x2="136" y2="134"/>
    <line x1="90" y1="30" x2="150" y2="134"/>
    <line x1="104" y1="30" x2="144" y2="134"/>
  </g>
  <!-- Denim cross lines (weft) -->
  <g clip-path="url(#lens-clip-192)" stroke="#3d5e8c" stroke-width="3" opacity="0.5">
    <line x1="30" y1="46" x2="134" y2="46"/>
    <line x1="30" y1="58" x2="134" y2="58"/>
    <line x1="30" y1="70" x2="134" y2="70"/>
    <line x1="30" y1="82" x2="134" y2="82"/>
    <line x1="30" y1="94" x2="134" y2="94"/>
    <line x1="30" y1="106" x2="134" y2="106"/>
    <line x1="30" y1="118" x2="134" y2="118"/>
  </g>
  <!-- Lens sheen -->
  <circle cx="82" cy="82" r="52" fill="none" stroke="none"/>
  <ellipse cx="68" cy="62" rx="16" ry="10" fill="white" opacity="0.18" transform="rotate(-20 68 62)"/>
  <!-- Thick cartoon outline for lens -->
  <circle cx="82" cy="82" r="52" fill="none" stroke="#171513" stroke-width="8"/>
  <!-- Handle -->
  <line x1="122" y1="122" x2="158" y2="162" stroke="#171513" stroke-width="16" stroke-linecap="round"/>
  <line x1="122" y1="122" x2="158" y2="162" stroke="#c9a96e" stroke-width="8" stroke-linecap="round"/>
  <!-- Inner lens ring detail -->
  <circle cx="82" cy="82" r="42" fill="none" stroke="#171513" stroke-width="3" opacity="0.3"/>
</svg>
